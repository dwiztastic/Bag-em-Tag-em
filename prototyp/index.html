<title>Bag em &amp; Tag em</title>
<meta name="description" content="Prototyp: fånga katter, fyll säcken och nå skåpbilen innan tiden tar slut.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  /* Spelet har ett eget, fast utseende – samma mörka ram i båda teman */
  :root { --bg: #1d2421; --fg: #f4f1e8; --accent: #f2c230; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; font-family: "Lilita One", system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; }
  .rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg); flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-size: 1.4rem; text-align: center; padding-inline: 16px; }
  .rotate .phone { width: 46px; height: 76px; border: 4px solid var(--accent); border-radius: 10px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { .rotate .phone { animation: none; transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 820px) { .rotate { display: flex; } }
</style>

<div id="game"></div>
<div class="rotate"><div class="phone"></div><div id="rotate-text"></div></div>
